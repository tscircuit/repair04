name: Clearance projection benchmark

on:
  pull_request:
    paths:
      - lib/**
      - scripts/benchmark-clearance-projection.ts
      - tests/fixtures/clearance-repros/**
      - tests/fixtures/clearance-projection-revisions.json
      - .github/workflows/clearance-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install baseline dependencies
        working-directory: baseline
        run: bun install
      - name: Install candidate dependencies
        working-directory: candidate
        run: bun install
      - name: Compare five alternating fresh-process pairs
        working-directory: candidate
        run: bun scripts/benchmark-clearance-projection.ts ../baseline 5 > clearance-benchmark.json
      - name: Summarize measured work and runtime
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const report = JSON.parse(fs.readFileSync('candidate/clearance-benchmark.json', 'utf8'))
            const median = values => {
              const sorted = [...values].sort((a, b) => a - b)
              return sorted[Math.floor(sorted.length / 2)]
            }
            const rows = [['Input', 'Base median ms', 'PR median ms', 'Change', 'Pairs base / PR']]
            for (let i = 0; i < report.results.base[0].cases.length; i++) {
              const base = median(report.results.base.map(run => run.cases[i].elapsedMs))
              const head = median(report.results.head.map(run => run.cases[i].elapsedMs))
              const before = report.results.base[0].cases[i]
              const after = report.results.head[0].cases[i]
              rows.push([before.name, base.toFixed(3), head.toFixed(3), ((head / base - 1) * 100).toFixed(1) + '%', before.candidatePairs + ' / ' + after.candidatePairs])
            }
            const base = report.medianTotalMs.base
            const head = report.medianTotalMs.head
            const total = 'Total projection median: ' + base.toFixed(3) + 'ms -> ' + head.toFixed(3) + 'ms (' + ((head / base - 1) * 100).toFixed(1) + '%)'
            console.log(total)
            console.log(JSON.stringify(rows))
            await core.summary
              .addHeading('Clearance projection, five fresh-process pairs')
              .addRaw(total + '\n\n')
              .addTable(rows)
              .addRaw('\nAll 13 immutable geometry hashes are checked in every process. Timing assertions are intentionally excluded from correctness tests.\n')
              .write()
      - uses: actions/upload-artifact@v4
        with:
          name: clearance-projection-comparison
          path: candidate/clearance-benchmark.json
