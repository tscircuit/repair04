419354839" fill="transparent" stroke="#cbd5e1" stroke-width="1.1481481481481481"/></g><g><rect data-type="rect" data-label="" data-x="823" data-y="320" x="580.9193548387096" y="153.2258064516129" width="413.70967741935476" height="330.9677419354839" fill="transparent" stroke="#cbd5e1" stroke-width="1.1481481481481481"/></g><g><polygon data-type="polygon" data-label="" data-points="110.75,438.75 348.25,438.75 348.25,201.25 110.75,201.25" points="167.42741935483866,422.13709677419354 374.2822580645161,422.13709677419354 374.2822580645161,215.28225806451613 167.42741935483866,215.28225806451613" fill="rgba(239,68,68,0.18)" stroke="#b45353" stroke-width="0.6096774193548387"/></g><g><polygon data-type="polygon" data-label="" data-points="656.75,438.75 894.25,438.75 894.25,201.25 656.75,201.25" points="642.9758064516129,422.13709677419354 849.8306451612902,422.13709677419354 849.8306451612902,215.28225806451613 642.9758064516129,215.28225806451613" fill="rgba(239,68,68,0.18)" stroke="#b45353" stroke-width="0.6096774193548387"/></g><circle data-type="circle" data-label="" data-x="412.375" data-y="320" cx="430.133064516129" cy="318.7096774193548" r="31.028225806451612" fill="#2563eb" stroke="white" stroke-width="1.1481481481481481"/><circle data-type="circle" data-label="" data-x="320.9375" data-y="320" cx="350.4939516129032" cy="318.7096774193548" r="11.32258064516129" fill="transparent" stroke="#dc2626" stroke-width="1.1481481481481481"/><circle data-type="circle" data-label="" data-x="958.375" data-y="320" cx="905.6814516129032" cy="318.7096774193548" r="31.028225806451612" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="1.1481481481481481"/><circle data-type="circle" data-label="" data-x="965.5" data-y="320" cx="911.8870967741934" cy="318.7096774193548" r="31.028225806451612" fill="#2563eb" stroke="white" stroke-width="1.1481481481481481"/><g data-type="arrow" data-start="958.375,320" data-end="965.5,320" data-double-sided="false"><line data-type="arrow-shaft" x1="905.6814516129032" y1="318.7096774193548" x2="908.4032258064517" y2="318.7096774193548" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><polygon data-type="arrow-head" points="911.8870967741934,318.7096774193548 908.4032258064517,323.93548387096774 908.4032258064517,313.48387096774195" fill="#64748b"/></g><text data-type="text" data-label="Foreign pad needs 0.15 mm; connected pads and via pairs keep their rules" data-x="24" data-y="24" x="91.87096774193546" y="60.903225806451616" fill="#0f172a" font-size="19.161290322580644" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Foreign pad needs 0.15 mm; connected pads and via pairs keep their rules</text><text data-type="text" data-label="Policy-focused repro; real Board1726 checkpoint is tested separately" data-x="24" data-y="47" x="91.87096774193546" y="80.93548387096774" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Policy-focused repro; real Board1726 checkpoint is tested separately</text><text data-type="text" data-label="Input" data-x="24" data-y="82" x="91.87096774193546" y="111.41935483870968" fill="#0f172a" font-size="15.67741935483871" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Input</text><text data-type="text" data-label="Focus DRC: 1 · context: 1 · fixed: 0" data-x="24" data-y="105" x="91.87096774193546" y="131.4516129032258" fill="#0f172a" font-size="12.193548387096774" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Focus DRC: 1 · context: 1 · fixed: 0</text><text data-type="text" data-label="Rules: trace 0.100 mm · via 0.100 mm" data-x="24" data-y="539" x="91.87096774193546" y="509.4516129032258" fill="#0f172a" font-size="11.32258064516129" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Rules: trace 0.100 mm · via 0.100 mm</text><text data-type="text" data-label="Projection candidate" data-x="570" data-y="82" x="567.4193548387096" y="111.41935483870968" fill="#0f172a" font-size="15.67741935483871" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Projection candidate</text><text data-type="text" data-label="Focus DRC: 0 · context: 0 · fixed: 0" data-x="570" data-y="105" x="567.4193548387096" y="131.4516129032258" fill="#0f172a" font-size="12.193548387096774" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Focus DRC: 0 · context: 0 · fixed: 0</text><text data-type="text" data-label="Rules: trace 0.100 mm · via 0.100 mm" data-x="570" data-y="539" x="567.4193548387096" y="509.4516129032258" fill="#0f172a" font-size="11.32258064516129" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Rules: trace 0.100 mm · via 0.100 mm</text><text data-type="text" data-label="Solid: top · dashed: other layers · gray: fixed copper / original via · red rings: measured contacts" data-x="24" data-y="573" x="91.87096774193546" y="539.0645161290322" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Solid: top · dashed: other layers · gray: fixed copper / original via · red rings: measured contacts</text><text data-type="text" data-label="target" data-x="48" data-y="600" x="112.77419354838707" y="562.5806451612904" fill="#0f172a" font-size="9.580645161290322" font-family="sans-serif" text-anchor="start" dominant-baseline="central">target</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="620" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '620');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.8709677419354839,"c":0,"e":70.96774193548384,"b":0,"d":0.8709677419354839,"f":40};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>