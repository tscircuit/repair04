<svg width="1400" height="320" viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-3,0 3,0" data-type="line" data-label="" points="74.23236514522821,176.2603734439834 279.62655601659753,176.2603734439834" fill="none" stroke="#dc2626" stroke-width="6.846473029045644"/></g><g><polyline data-points="7,0 8.5125,-0.6875 8.8125,-0.7124999999999999 11.9375,-0.7124999999999999 13,0" data-type="line" data-label="" points="416.5560165975104,176.2603734439834 468.332468879668,199.7951244813278 478.6021784232365,200.6509336099585 585.5783195020747,200.6509336099585 621.9502074688796,176.2603734439834" fill="none" stroke="#2563eb" stroke-width="6.846473029045644"/></g><g><polyline data-points="17,0 18.4125,-0.8875 18.9375,-0.9124999999999999 21.9625,-0.9124999999999999 22.0875,-0.8374999999999999 23,0" data-type="line" data-label="" points="758.8796680497925,176.2603734439834 807.2328838174274,206.64159751037346 825.2048755186722,207.49740663900417 928.7577800829874,207.49740663900417 933.036825726141,204.92997925311204 964.2738589211618,176.2603734439834" fill="none" stroke="#2563eb" stroke-width="6.846473029045644"/></g><g><polyline data-points="27,0 28.0125,-1.0125 28.4125,-1.1875 28.9125,-1.2125 32.0125,-1.2125 32.2375,-1.1124999999999998 32.6875,-0.6624999999999999 33,0" data-type="line" data-label="" points="1101.2033195020747,176.2603734439834 1135.863589211618,210.92064315352698 1149.5565352697095,216.91130705394193 1166.6727178423237,217.76711618257264 1272.7930497925313,217.76711618257264 1280.4953319502074,214.3438796680498 1295.89989626556,198.9393153526971 1306.597510373444,176.2603734439834" fill="none" stroke="#2563eb" stroke-width="6.846473029045644"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="107.79564315352698" width="273.8589211618257" height="136.92946058091286" fill="transparent" stroke="#cbd5e1" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="1.3" data-y="0" x="200.8921161825726" y="155.72095435684648" width="41.07883817427384" height="41.07883817427387" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="10" data-y="0" x="382.32365145228215" y="107.79564315352698" width="273.85892116182566" height="136.92946058091286" fill="transparent" stroke="#cbd5e1" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="11.3" data-y="0" x="543.2157676348547" y="155.72095435684648" width="41.07883817427387" height="41.07883817427387" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="20" data-y="0" x="724.6473029045643" y="107.79564315352698" width="273.8589211618257" height="136.92946058091286" fill="transparent" stroke="#cbd5e1" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="21.3" data-y="0" x="885.5394190871369" y="155.72095435684648" width="41.07883817427387" height="41.07883817427387" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="30" data-y="0" x="1066.9709543568465" y="107.79564315352698" width="273.8589211618255" height="136.92946058091286" fill="transparent" stroke="#cbd5e1" stroke-width="0.029212121212121214"/></g><g><rect data-type="rect" data-label="" data-x="31.3" data-y="0" x="1227.863070539419" y="155.72095435684648" width="41.0788381742741" height="41.07883817427387" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/></g><circle data-type="circle" data-label="" data-x="-1.3" data-y="0" cx="132.42738589211618" cy="176.2603734439834" r="20.539419087136928" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/><circle data-type="circle" data-label="" data-x="8.7" data-y="0" cx="474.7510373443983" cy="176.2603734439834" r="20.539419087136928" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/><circle data-type="circle" data-label="" data-x="18.7" data-y="0" cx="817.0746887966804" cy="176.2603734439834" r="20.539419087136928" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/><circle data-type="circle" data-label="" data-x="28.7" data-y="0" cx="1159.3983402489625" cy="176.2603734439834" r="20.539419087136928" fill="#e2e8f0" stroke="#475569" stroke-width="0.029212121212121214"/><text data-type="text" data-label="Input" data-x="0" data-y="2.95" x="176.92946058091286" y="75.27489626556017" fill="black" font-size="32.52074688796681" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Input</text><text data-type="text" data-label="0.0 mm clearance" data-x="10" data-y="2.95" x="519.2531120331951" y="75.27489626556017" fill="black" font-size="32.52074688796681" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.0 mm clearance</text><text data-type="text" data-label="0.2 mm clearance" data-x="20" data-y="2.95" x="861.5767634854772" y="75.27489626556017" fill="black" font-size="32.52074688796681" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.2 mm clearance</text><text data-type="text" data-label="0.5 mm clearance" data-x="30" data-y="2.95" x="1203.9004149377593" y="75.27489626556017" fill="black" font-size="32.52074688796681" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.5 mm clearance</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="320" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1400" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1400');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '320');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":34.232365145228215,"c":0,"e":176.92946058091286,"b":0,"d":-34.232365145228215,"f":176.2603734439834};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>