Shared power branches beside a fixed ground via</text><text data-type="text" data-label="Reduced topology from the H616 board&apos;s power and ground repair." data-x="24" data-y="47" x="91.87096774193546" y="80.93548387096774" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Reduced topology from the H616 board's power and ground repair.</text><text data-type="text" data-label="Input" data-x="24" data-y="82" x="91.87096774193546" y="111.41935483870968" fill="#0f172a" font-size="15.67741935483871" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Input</text><text data-type="text" data-label="Focus DRC: 2 · context: 2 · fixed: 0" data-x="24" data-y="105" x="91.87096774193546" y="131.4516129032258" fill="#0f172a" font-size="12.193548387096774" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Focus DRC: 2 · context: 2 · fixed: 0</text><text data-type="text" data-label="Target via/trace gap: 0.015 mm (Via to power trace)" data-x="24" data-y="123" x="91.87096774193546" y="147.1290322580645" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Target via/trace gap: 0.015 mm (Via to power trace)</text><text data-type="text" data-label="Min different-net via gap: 1.664 mm · rule 0.100 mm" data-x="24" data-y="539" x="91.87096774193546" y="509.4516129032258" fill="#0f172a" font-size="11.32258064516129" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Min different-net via gap: 1.664 mm · rule 0.100 mm</text><text data-type="text" data-label="Projection candidate" data-x="570" data-y="82" x="567.4193548387096" y="111.41935483870968" fill="#0f172a" font-size="15.67741935483871" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Projection candidate</text><text data-type="text" data-label="Focus DRC: 0 · context: 0 · fixed: 0" data-x="570" data-y="105" x="567.4193548387096" y="131.4516129032258" fill="#0f172a" font-size="12.193548387096774" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Focus DRC: 0 · context: 0 · fixed: 0</text><text data-type="text" data-label="Target via/trace gap: 0.100 mm (Via to power trace)" data-x="570" data-y="123" x="567.4193548387096" y="147.1290322580645" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Target via/trace gap: 0.100 mm (Via to power trace)</text><text data-type="text" data-label="Min different-net via gap: 1.664 mm · rule 0.100 mm" data-x="570" data-y="539" x="567.4193548387096" y="509.4516129032258" fill="#0f172a" font-size="11.32258064516129" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Min different-net via gap: 1.664 mm · rule 0.100 mm</text><text data-type="text" data-label="Solid: top · dashed: other layers · gray: fixed copper / original via · red rings: measured contacts" data-x="24" data-y="573" x="91.87096774193546" y="539.0645161290322" fill="#0f172a" font-size="10.451612903225806" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Solid: top · dashed: other layers · gray: fixed copper / original via · red rings: measured contacts</text><text data-type="text" data-label="ground" data-x="48" data-y="600" x="112.77419354838707" y="562.5806451612904" fill="#0f172a" font-size="9.580645161290322" font-family="sans-serif" text-anchor="start" dominant-baseline="central">ground</text><text data-type="text" data-label="power" data-x="122" data-y="600" x="177.22580645161287" y="562.5806451612904" fill="#0f172a" font-size="9.580645161290322" font-family="sans-serif" text-anchor="start" dominant-baseline="central">power</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="620" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '620');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.8709677419354839,"c":0,"e":70.96774193548384,"b":0,"d":0.8709677419354839,"f":40};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>