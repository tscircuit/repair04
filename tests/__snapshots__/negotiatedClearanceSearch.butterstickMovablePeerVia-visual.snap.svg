roke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="387.9999999999988" data-y="538.2222222222235" cx="412.2285714285703" cy="516.7111111111122" r="39.36507936507937" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="387.9999999999988" data-y="360.4444444444457" cx="412.2285714285703" cy="359.2507936507948" r="39.36507936507937" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="387.9999999999988" data-y="182.6666666666679" cx="412.2285714285703" cy="201.79047619047728" r="39.36507936507937" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="565.7777777777766" data-y="538.2222222222235" cx="569.6888888888877" cy="516.7111111111122" r="39.36507936507937" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="565.7777777777766" data-y="360.4444444444457" cx="569.6888888888877" cy="359.2507936507948" r="39.36507936507937" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="565.7777777777766" data-y="182.6666666666679" cx="569.6888888888877" cy="201.79047619047728" r="39.36507936507937" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1111111111112" data-y="271.5555555555555" cx="333.4984126984127" cy="280.52063492063485" r="39.36507936507937" fill="#e2e8f0" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1111111111112" data-y="271.5555555555555" cx="333.4984126984127" cy="280.52063492063485" r="19.682539682539684" fill="white" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="476.88888888888914" data-y="271.5555555555555" cx="490.95873015873036" cy="280.52063492063485" r="39.36507936507937" fill="#e2e8f0" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="476.88888888888914" data-y="271.5555555555555" cx="490.95873015873036" cy="280.52063492063485" r="19.682539682539684" fill="white" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="476.88888888888914" data-y="449.33333333333326" cx="490.95873015873036" cy="437.9809523809523" r="39.36507936507937" fill="#e2e8f0" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="476.88888888888914" data-y="449.33333333333326" cx="490.95873015873036" cy="437.9809523809523" r="19.682539682539684" fill="white" stroke="#475569" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1113333333321" data-y="449.3331111111111" cx="333.4986095238084" cy="437.98075555555556" r="39.36507936507937" fill="transparent" stroke="#0369a1" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1113333333321" data-y="449.3331111111111" cx="333.4986095238084" cy="437.98075555555556" r="19.682539682539684" fill="white" stroke="#0369a1" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1111111111112" data-y="431.7089022135011" cx="333.4984126984127" cy="422.37074196052953" r="39.36507936507937" fill="transparent" stroke="#a855f7" stroke-width="1.1290322580645162"/><circle data-type="circle" data-label="" data-x="299.1111111111112" data-y="431.7089022135011" cx="333.4984126984127" cy="422.37074196052953" r="19.682539682539684" fill="white" stroke="#a855f7" stroke-width="1.1290322580645162"/><text data-type="text" data-label="ButterStick DDR: let movable peer vias negotiate" data-x="32" data-y="38" x="96.9142857142857" y="73.65714285714286" fill="#172033" font-size="24.799999999999997" font-family="sans-serif" text-anchor="start" dominant-baseline="central">ButterStick DDR: let movable peer vias negotiate</text><text data-type="text" data-label="Native BGA escape: two same-net MST branches share a drill near a movable foreign-net via." data-x="32" data-y="72" x="96.9142857142857" y="103.77142857142857" fill="#475569" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Native BGA escape: two same-net MST branches share a drill near a movable foreign-net via.</text><text data-type="text" data-label="No candidate path" data-x="790" data-y="145" x="768.2857142857142" y="168.42857142857142" fill="#b45309" font-size="21.257142857142856" font-family="sans-serif" text-anchor="start" dominant-baseline="central">No candidate path</text><text data-type="text" data-label="270 search states popped" data-x="790" data-y="180" x="768.2857142857142" y="199.42857142857142" fill="#475569" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">270 search states popped</text><text data-type="text" data-label="Blue: existing same-net branches" data-x="790" data-y="235" x="768.2857142857142" y="248.14285714285714" fill="#0369a1" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: existing same-net branches</text><text data-type="text" data-label="Purple: movable foreign-net via" data-x="790" data-y="265" x="768.2857142857142" y="274.71428571428567" fill="#a855f7" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Purple: movable foreign-net via</text><text data-type="text" data-label="Gray: fixed pads, vias and copper" data-x="790" data-y="295" x="768.2857142857142" y="301.2857142857143" fill="#475569" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Gray: fixed pads, vias and copper</text><text data-type="text" data-label="The search cannot move past the peer." data-x="790" data-y="480" x="768.2857142857142" y="465.1428571428571" fill="#b45309" font-size="15.942857142857143" font-family="sans-serif" text-anchor="start" dominant-baseline="central">The search cannot move past the peer.</text><text data-type="text" data-label="This view is an intermediate search." data-x="790" data-y="515" x="768.2857142857142" y="496.1428571428571" fill="#172033" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">This view is an intermediate search.</text><text data-type="text" data-label="Final negotiation must clear conflicts." data-x="790" data-y="545" x="768.2857142857142" y="522.7142857142857" fill="#172033" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Final negotiation must clear conflicts.</text><text data-type="text" data-label="Solid copper: top layer. Dashed copper: inner1. Pale blue: the selected input span." data-x="32" data-y="628" x="96.9142857142857" y="596.2285714285714" fill="#475569" font-size="13.285714285714285" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Solid copper: top layer. Dashed copper: inner1. Pale blue: the selected input span.</text><text data-type="text" data-label="Pad pitch 0.8 mm; pad/via diameter 0.4 mm; drill diameter 0.2 mm; trace width 0.089 mm." data-x="32" data-y="656" x="96.9142857142857" y="621.0285714285714" fill="#475569" font-size="13.285714285714285" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Pad pitch 0.8 mm; pad/via diameter 0.4 mm; drill diameter 0.2 mm; trace width 0.089 mm.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.8857142857142857,"c":0,"e":68.57142857142856,"b":0,"d":0.8857142857142857,"f":40};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>